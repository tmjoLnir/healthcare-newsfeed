# Verified 2026-08-25. Re-check with `python tools/verify_feeds.py config/sources.yaml`.
#
# retention = how much history the feed holds. Five sources turn over in
# under a week, which is why polling is daily and the store is mandatory.
# See README "Why polling is daily".

defaults:
  adapter: rss
  licence: link_only
  poll_hours: 24
  enabled: true

sources:

  # --- Daily-cadence reporting -------------------------------------------
  - key: statnews
    name: STAT — Health
    url: https://www.statnews.com/category/health/feed/
    weight: 1.0
    paywalled: true            # headlines free, most articles metered
    sections: [story_of_week, also_reading]
    retention_days: 7          # verified: 20 items, 20 in last 7d

  - key: medpage
    name: MedPage Today
    url: https://www.medpagetoday.com/rss/headlines.xml
    weight: 0.9
    sections: [story_of_week, also_reading]
    retention_days: 4          # verified: 20 items, turns over fast

  - key: bbc_health
    name: BBC Health
    url: https://feeds.bbci.co.uk/news/health/rss.xml
    weight: 0.7                # breaking news decays over a week; see score.py
    sections: [story_of_week, also_reading]
    retention_days: 126

  # --- Explainers (full text, republishable) ------------------------------
  - key: conversation_uk
    name: The Conversation — UK Health
    url: https://theconversation.com/uk/health/articles.atom
    licence: cc                # CC-BY-ND
    weight: 1.0
    sections: [explainer, ethics, also_reading]
    retention_days: 11

  - key: conversation_au
    name: The Conversation — AU Health
    url: https://theconversation.com/au/health/articles.atom
    licence: cc
    weight: 0.9
    sections: [explainer, also_reading]
    retention_days: 14

  - key: conversation_id
    name: The Conversation — Indonesia (Kesehatan)
    url: https://theconversation.com/id/kesehatan/articles.atom
    licence: cc
    weight: 0.9                # SE Asia signal, and now health-only
    sections: [explainer, also_reading]
    retention_days: 77         # verified: 25 items, 9 in last 30d
    notes: >
      The edition-wide feed (/id/articles.atom) carried roughly twice the
      volume and mostly not health — folklore, pets, forest fires. This is
      the health section: ~1.9 items/week, nearly all usable. Same CC-BY-ND
      licence and full text. Copy is in Indonesian. There is no /id/health/
      path; that 404s. Key kept so stored items keep their source.

  # --- Journals (weekly by nature — aligned with the publish cycle) --------
  - key: nejm
    name: New England Journal of Medicine
    url: https://www.nejm.org/action/showFeed?type=etoc&feed=rss&jc=nejm
    weight: 1.0
    paywalled: true
    sections: [journals]
    retention_days: 123
    notes: >
      Feed carries an 87-character citation string in place of a summary,
      so items render title + link only. Also returns 403 to GitHub Actions
      runners and other datacenter IPs while serving normally elsewhere —
      the deployed poller may need a residential or proxied egress address.

  - key: lancet
    name: The Lancet
    url: https://www.thelancet.com/rssfeed/lancet_online.xml
    weight: 1.0
    paywalled: true
    sections: [journals, global_health]
    retention_days: 23

  - key: jama_online
    name: JAMA — Online First
    url: https://jamanetwork.com/rss/site_3/onlineFirst_67.xml
    weight: 0.9
    paywalled: true
    sections: [journals]
    retention_days: 4

  # The regional trio — the reason the issue is not entirely UK/US/global.
  # Surveyed and measured in docs/asia-sources.md.
  - key: annals_sg
    name: Annals, Academy of Medicine Singapore
    url: https://annals.edu.sg/feed/
    licence: cc                # CC BY-NC-SA 4.0, open access since April 2023
    weight: 1.0                # Singapore's own journal; peak relevance for this audience
    sections: [journals, global_health]
    retention_days: 41         # verified: 10 items, 4 in last 30d
    notes: >
      Full article text in-feed (10k-39k chars), strongly Singapore and
      South-East Asia weighted — SEA stroke bibliometrics, adaptive expertise
      in the region, myopia and dementia burden in China. Note the licence is
      CC-BY-NC-SA, not the CC-BY-ND the other `cc` sources carry: the
      non-commercial term fits a free channel, but share-alike is a real
      condition, so downgrade this row to link_only if the channel ever
      monetises. About one item a week, and roughly one in ten is an
      administrative "Continuing Medical Education" post carrying no body.

  - key: lancet_wpc
    name: The Lancet Regional Health — Western Pacific
    url: https://www.thelancet.com/rssfeed/lanwpc_online.xml
    weight: 0.9
    sections: [journals, global_health]
    retention_days: 37         # verified: 16 items, 15 in last 30d
    notes: >
      Same RSS 1.0 / dc:date shape as the `lancet` row, so entry_date already
      handles it. Gold open access, so not marked paywalled — but article
      pages 403 to datacenter IPs even while the feed serves, so the licence
      could not be confirmed and this stays at the link_only default.

  - key: lancet_sea
    name: The Lancet Regional Health — Southeast Asia
    url: https://www.thelancet.com/rssfeed/lansea_online.xml
    weight: 0.9
    sections: [journals, global_health]
    retention_days: 299        # verified: 15 items, 8 in last 30d
    notes: Same shape, same unconfirmed licence, as lancet_wpc.

  - key: nature_med
    name: Nature Medicine
    url: https://www.nature.com/nm.rss
    weight: 0.9
    paywalled: true
    sections: [journals]
    retention_days: 4
    tolerate_failure: true
    notes: Host responds intermittently; tolerate fetch failure without failing the run.

  # --- Ethics (thin supply, high value — protected by its own quota) -------
  - key: jme_ethics
    name: BMJ Journal of Medical Ethics blog
    url: https://blogs.bmj.com/medical-ethics/feed/
    weight: 1.0
    sections: [ethics]
    retention_days: 43         # ~1-2 posts/week, bursty; can be silent a fortnight

  # --- Policy (full text, republishable) -----------------------------------
  - key: kff
    name: KFF Health News
    url: https://kffhealthnews.org/feed/
    licence: cc                # explicitly invites republication
    weight: 0.8                # US-centric; useful for policy contrast
    sections: [policy, also_reading]
    retention_days: 6

  # --- Official (public domain, JSON not RSS) ------------------------------
  - key: who_news
    name: WHO — News
    url: https://www.who.int/api/news/newsitems
    adapter: who_odata
    licence: public_domain
    weight: 1.0
    sections: [global_health, also_reading]
    notes: >
      The list endpoint returns Title, PublicationDateAndTime, NewsType and
      ItemDefaultUrl only — no body text — so items render title + link.
      ItemDefaultUrl is a bare slug; prefix with https://www.who.int/news/item
      (verified 2026-08-25 — https://www.who.int alone 404s, and outbreak news
      uses a different base again). NewsType ("Statement", "News release", ...)
      is carried through as the item's category.

  - key: who_dons
    name: WHO — Disease Outbreak News
    url: https://www.who.int/api/news/diseaseoutbreaknews
    adapter: who_odata
    licence: public_domain
    weight: 1.0
    sections: [global_health]
    notes: >
      Same API, different shape: records carry a plain-text Summary (~3,000
      chars) plus HTML body sections, and ItemDefaultUrl (`/2026-DON615`)
      hangs off https://www.who.int/emergencies/disease-outbreak-news/item.
      The collection is an archive — $top alone returns items going back
      months, so the poll depends on the explicit ordering.

