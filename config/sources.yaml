#   duke-nus.edu.sg      reachable again 2026-08-25, but no feed at any path
#   lkcmedicine.ntu.edu.sg  gateway 502
#   straitstimes.com     feeds are healthy, but no health section exists and
#                        keyword-filtering general news yields ~0 healthcare
#                        items; measured in docs/asia-sources.md
