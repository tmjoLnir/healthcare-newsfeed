# Weekly issue template.
#
# Quotas are per-section so a heavy news week cannot crowd out the thin-supply
# sections. `min: 0` means the section is omitted entirely when nothing
# qualifies — better a missing block than a weak filler item.

issue:
  title: "This Week in Medicine"
  timezone: Asia/Singapore
  publish: "SUN 19:00"        # after the weekend's journal releases land
  max_message_chars: 4096     # Telegram hard limit; split on section boundaries
  max_messages: 1             # the issue arrives as one post, not a thread:
                              # sections fill to their quotas, then the
                              # weakest items above each `min` are dropped
                              # until the whole issue renders within this.

  # How fresh an item must be to fill a section's *optional* slots — the ones
  # above its `min`. Guaranteed slots ignore this, so the issue always gets a
  # lead story; a `min: 0` section is governed by it entirely, which is what
  # gives "better a missing block than a weak filler item" its teeth.
  #
  # This is a recency score, the same 1.0-to-0.0 decay score.py applies: 1.0
  # up to a week old, then straight down to 0.0 at sixty days. 0.5 is about
  # thirty-three days. Measured against a real week (2026-08-25), the oldest
  # item the issue actually carried scored 0.62 — twenty-seven days, a
  # global-health item — so this sits below what currently publishes with
  # room to spare, and still excludes the four-month-old ministry release
  # that prompted it.
  min_recency: 0.5

sections:

  - key: story_of_week
    heading: "🔬 Story of the week"
    min: 1
    max: 1
    style: long               # headline + context paragraph

  - key: journals
    heading: "📊 From the journals"
    min: 2
    max: 4
    style: short
    diversify_by: source      # avoid three NEJM items in one issue

  - key: explainer
    heading: "💡 Explainer"
    min: 1
    max: 2
    style: short              # same ask as the other sections; see README

  - key: ethics
    heading: "⚖️ Ethics corner"
    min: 0                    # JME is bursty; omit rather than pad
    max: 1
    style: long

  - key: global_health
    heading: "🌍 Global health watch"
    min: 0
    max: 2
    style: short

  - key: policy
    heading: "🏥 Policy"
    min: 0
    max: 1
    style: short

  - key: also_reading
    heading: "📌 Also worth reading"
    min: 3
    max: 6
    style: headline           # title + link only
