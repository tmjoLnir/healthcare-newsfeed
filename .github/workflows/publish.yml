name: publish

on:
  schedule:
    - cron: "0 11 * * 0"     # Sunday 11:00 UTC = 19:00 SGT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print the issue without posting"
        type: boolean
        default: false

# Shares the poll's group: publish reads the same file, and a poll landing
# mid-publish would change the week under it. See poll.yml.
concurrency:
  group: newsfeed-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write         # re-enable the schedules, see the last step
    env:
      NEWSFEED_DB: data/newsfeed.db
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -e .

      # No bootstrap input on purpose. Publishing is the one command that
      # must never run against an empty store: it would post an issue built
      # from nothing, or nothing at all, and record it as sent.
      - name: Restore the store
        id: restore
        run: tools/store_sync.sh restore

      - name: Publish weekly issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: newsfeed publish ${{ inputs.dry_run && '--dry-run' || '' }}

      # A dry run writes nothing, so there is nothing to push back. A real
      # publish records the issue and marks its items, and that must survive
      # even if a later step fails — otherwise next week reruns this issue.
      - name: Save the store
        if: always() && steps.restore.outcome == 'success' && inputs.dry_run != true
        run: tools/store_sync.sh save

      # GitHub disables a scheduled workflow after 60 days without repository
      # activity — and the store lives in a Release, so a healthy daily poll
      # makes no commits and counts as no activity. That is exactly what
      # happened on 2026-10-26: poll went quiet, nothing failed, and the
      # Sunday issue found an empty week. Re-enabling through the API resets
      # the clock without a commit. Both workflows refresh both, so either one
      # running is enough to keep the other alive.
      - name: Keep the schedules alive
        if: always()
        run: |
          for workflow in poll.yml publish.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done
